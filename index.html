<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7fb0d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hungry Orca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #06243d; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ---------- Setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const G = {};             // cached gradients (built once in resize, see buildGradients)
const H = 540;            // game height (fixed); width adapts to the screen
const SURFACE = 130;      // water surface line
const SEABED = 500;       // sea floor line
const ORCA_X = 210;       // orca stays at this x, the world scrolls past
const FONT = 'Fredoka, "Trebuchet MS", sans-serif';

let W = 960, scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sw = innerWidth, sh = innerHeight;
  cv.width = Math.round(sw * dpr);
  cv.height = Math.round(sh * dpr);
  scale = sh / H;
  W = sw / scale;
  if (W < 720) { scale = sw / 720; W = 720; }
  W = Math.min(W, 1600);
  offX = (sw - W * scale) / 2;
  offY = (sh - H * scale) / 2;
  buildGradients();
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ---------- Sound (tiny synth, no files) ----------
let actx = null, muted = false;
function audioInit() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f1, f2, dur, type, vol) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f1, n);
  o.frequency.exponentialRampToValueAtTime(f2, n + dur);
  g.gain.setValueAtTime(vol, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  o.connect(g).connect(actx.destination);
  o.start(n); o.stop(n + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(); src.buffer = buf;
  const fl = actx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(fl).connect(g).connect(actx.destination);
  src.start();
}
const sfx = {
  swim()   { tone(260, 420, 0.12, 'sine', 0.05); },
  eat()    { tone(500, 900, 0.09, 'triangle', 0.12); },
  splash() { noise(0.35, 0.25, 1500); },
  seal()   { tone(400, 1200, 0.18, 'square', 0.05); },
  pop()    { noise(0.6, 0.5, 900); tone(220, 40, 0.45, 'sine', 0.3); },
  hit()    { tone(220, 80, 0.3, 'sawtooth', 0.08); },
  life()   { tone(600, 1200, 0.25, 'triangle', 0.1); },
  over()   { tone(400, 100, 0.7, 'triangle', 0.12); },
  harpoon() { noise(0.25, 0.45, 2500); tone(160, 60, 0.25, 'square', 0.08); },
  tear()   { noise(0.3, 0.35, 5000); tone(900, 300, 0.15, 'sawtooth', 0.04); },
};

// ---------- Saved best score ----------
function loadBest() { try { return +localStorage.getItem('hungryOrcaBest') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('hungryOrcaBest', v); } catch (e) {} }

// ---------- Game state ----------
let state = 'title';      // 'title' | 'play' | 'over'
let t = 0, overAt = 0, best = loadBest(), newBest = false;
let score, lives, speed, elapsed, invuln, shake, nextLifeAt;
let orca, fishes, floes, seals, obstacles, sunfish, warn, particles, texts;
let fishTimer, floeTimer, obsTimer, sunTimer;
let harpoons = [];
let dieKind = null, dieT = 0, netBoat = null; // how the orca died: 'net' (stuck) or 'flip' (belly-up)
let bedOff = 0, mountOff = 0, rayOff = 0;

const clouds = Array.from({ length: 6 }, (_, i) => ({ x: i * 280 + rand(0, 120), y: rand(20, 75), s: rand(0.6, 1.1) }));
const WEED_P = 1800;
const weeds = Array.from({ length: 24 }, () => ({ x: rand(0, WEED_P), h: rand(35, 90), ph: rand(0, 6), w: rand(4, 8), c: pick(['#3f6a3a', '#4e7a3c', '#355a33', '#5d6e35']) }));
const rocks = Array.from({ length: 14 }, () => ({ x: rand(0, WEED_P), w: rand(14, 44), h: rand(8, 24), c: pick(['#3a4654', '#2f3a46', '#46525f']) }));
const stars = Array.from({ length: 4 }, () => ({ x: rand(0, WEED_P), r: rand(6, 9), a: rand(0, 6), c: pick(['#c9603b', '#d97a4a', '#b24d5e']) }));
const pebbles = Array.from({ length: 40 }, () => ({ x: rand(0, WEED_P), y: rand(12, 36), r: rand(1, 2.5) }));
const snow = Array.from({ length: 70 }, () => ({ x: rand(0, 2000), y: rand(0, 1), r: rand(0.7, 1.8), ph: rand(0, 6) })); // drifting "marine snow"

function reset() {
  score = 0; lives = 3; speed = 105; elapsed = 0; invuln = 0; shake = 0; nextLifeAt = 50;
  orca = { y: 300, vy: 0, chomp: 0, bubble: 0, mouth: 0, snap: 0 };
  fishes = []; floes = []; seals = []; obstacles = []; particles = []; texts = [];
  sunfish = null; warn = null; dieKind = null; dieT = 0; netBoat = null; harpoons = [];
  fishTimer = 0.5; floeTimer = 3; obsTimer = 6; sunTimer = rand(22, 30);
}
reset();

function start() { reset(); state = 'play'; newBest = false; }

function die(kind, o) {
  state = 'dying'; dieKind = kind; dieT = 0; invuln = 0; orca.mouth = 0; orca.flip = 0;
  if (kind === 'net') { netBoat = o; o.caught = true; orca.netOff = ORCA_X - o.x; addText(ORCA_X, orca.y - 55, 'Caught!', '#ff9a9a', 32); }
  else addText(ORCA_X, orca.y - 55, 'Oh no!', '#ff9a9a', 32);
}

function gameOver() {
  state = 'over'; overAt = t; sfx.over();
  if (score > best) { best = score; saveBest(best); newBest = true; }
}

// ---------- Input ----------
function swim() {
  orca.vy = -240;
  sfx.swim();
  for (let i = 0; i < 3; i++) bubble(ORCA_X - 40, orca.y + rand(-6, 6), 2 + Math.random() * 2);
}
function onPress(gx, gy) {
  audioInit();
  if (gx !== undefined && gx > W - 70 && gy < 60) { muted = !muted; return; }
  if (state === 'title') { start(); swim(); }
  else if (state === 'play') swim();
  else if (state === 'over' && t - overAt > 0.8) start();
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  onPress((e.clientX - offX) / scale, (e.clientY - offY) / scale);
});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) onPress();
  } else if (e.code === 'KeyM') muted = !muted;
});

// ---------- Helpers ----------
function waveY(x) { return SURFACE + Math.sin(x * 0.013 + t * 1.4) * 4 + Math.sin(x * 0.037 - t * 2.1) * 2; }
function orcaAngle() { return clamp(orca.vy / 500, -0.35, 0.35); }
// Points along the orca's body, used for collisions
function orcaPts() {
  const a = orcaAngle(), c = Math.cos(a), s = Math.sin(a);
  return [-35, -15, 5, 25, 45].map(d => ({ x: ORCA_X + d * c, y: orca.y + d * s }));
}
function hitsCircle(cx, cy, r, pad) { return orcaPts().some(p => Math.hypot(p.x - cx, p.y - cy) < r + pad); }
function mouthHits(cx, cy, r) { return orcaPts().slice(2).some(p => Math.hypot(p.x - cx, p.y - cy) < r + 24); }
function hitsRect(rx, ry, rw, rh, pad) {
  return orcaPts().some(p => {
    const nx = clamp(p.x, rx, rx + rw), ny = clamp(p.y, ry, ry + rh);
    return Math.hypot(p.x - nx, p.y - ny) < pad;
  });
}
function addText(x, y, s, c, size) { texts.push({ x, y, s, c, size: size || 26, life: 1.1 }); }
function addScore(n, x, y, label, size) {
  score += n;
  addText(x, y, label || '+' + n, '#fff7c2', size);
  if (score >= nextLifeAt) {
    nextLifeAt += 50;
    if (lives < 3) { lives++; sfx.life(); addText(ORCA_X, orca.y - 50, '+1 life', '#ff8fb1', 28); }
  }
}

// ---------- Particles ----------
function bubble(x, y, r) { particles.push({ k: 'bubble', x, y, vx: rand(-15, 5), vy: rand(-40, -20), g: -60, r, life: rand(1, 2), max: 2 }); }
function splash(x) {
  for (let i = 0; i < 14; i++) particles.push({ k: 'drop', x: x + rand(-10, 10), y: SURFACE, vx: rand(-90, 90), vy: rand(-280, -120), g: 650, r: rand(2, 4), life: 0.9, max: 0.9 });
  for (let i = 0; i < 6; i++) bubble(x + rand(-15, 15), SURFACE + rand(10, 30), rand(2, 5));
}
function explode(x, y) {
  particles.push({ k: 'ring', x, y, r: 10, life: 0.5, max: 0.5, vx: 0, vy: 0, g: 0 });
  for (let i = 0; i < 28; i++) {
    const a = rand(0, Math.PI * 2), v = rand(100, 330);
    particles.push({ k: 'bit', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 120, r: rand(3, 8), c: pick(['#9aa7b3', '#c7d0d8', '#ffb3c1', '#e7ecf0']), life: rand(0.8, 1.4), max: 1.4, rot: rand(0, 6) });
  }
  for (let i = 0; i < 14; i++) {
    const a = rand(0, Math.PI * 2), v = rand(80, 260);
    particles.push({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 60, r: rand(5, 9), life: rand(0.8, 1.2), max: 1.2, rot: rand(0, 6) });
  }
  for (let i = 0; i < 20; i++) bubble(x + rand(-40, 40), y + rand(-40, 40), rand(2, 7));
}

// ---------- Spawning ----------
function spawnFish() {
  fishes.push({ x: W + 20, by: rand(SURFACE + 40, SEABED - 40), y: 0, vx: rand(25, 55), ph: rand(0, 6),
    c: pick(['#3a6a8c', '#4d7a5a', '#5a5f8c', '#b8603a']), s: rand(0.85, 1.2) }); // back colour: herring, cod, capelin, redfish
}
function rightEdge(o) { return o.type === 'boat' ? o.x + 245 : o.type === 'whaler' ? o.x + 175 : o.type === 'sub' ? o.x + 185 : o.x + 25; }
const onSurface = o => o.type === 'boat' || o.type === 'whaler';
function spawnFloe() {
  if (obstacles.some(o => onSurface(o) && rightEdge(o) > W - 60)) { floeTimer = 0.5; return; }
  const w = rand(110, 160);
  const j = () => rand(-3, 3);
  floes.push({ x: W + 20, w, hasSeal: Math.random() < 0.8, tipped: false, tipT: 0, seed: rand(0, 6),
    pts: [[-w / 2, 2], [-w / 2 + 8, -12 + j()], [-w * 0.2, -15 + j()], [w * 0.15, -13 + j()], [w / 2 - 10, -14 + j()], [w / 2, 2], [w / 2 - 12, 20], [-w / 2 + 14, 22]] });
  floeTimer = rand(4.5, 7.5);
}
function spawnObstacle() {
  if (obstacles.some(o => rightEdge(o) > W - 280)) { obsTimer = 0.4; return; }
  const r = Math.random();
  let type = r < 0.28 ? 'boat' : r < 0.56 ? 'sub' : r < 0.78 ? 'jelly' : 'whaler';
  if (type === 'whaler' && elapsed < 15) type = 'sub'; // no harpoons in the first seconds
  if ((type === 'boat' || type === 'whaler') && floes.some(f => f.x + f.w > W - 260)) type = 'sub';
  if (type === 'boat') obstacles.push({ type, x: W + 20, net: rand(110, 165), seed: rand(0, 6), sway: 0, depth: 0 });
  else if (type === 'whaler') obstacles.push({ type, x: W + 20, seed: rand(0, 6), cool: 1.2, shots: 0, aim: Math.PI * 0.75, recoil: 0 });
  else if (type === 'sub') obstacles.push({ type, x: W + 20, by: rand(SURFACE + 115, SEABED - 80), y: 0, ph: rand(0, 6), tilt: 0 });
  else obstacles.push({ type, x: W + 20, by: rand(SURFACE + 70, SEABED - 70), y: 0, ph: rand(0, 6) });
  obsTimer = rand(4.5, 7) - Math.min(2.5, elapsed / 70);
}

// ---------- Update ----------
function update(dt) {
  t += dt;
  // world scroll speed
  let ws = state === 'play' ? speed : state === 'title' ? 70 : 0;
  if (state === 'dying') ws = dieKind === 'net' ? speed * 0.35 : speed * Math.max(0, 1 - dieT / 1.2);
  bedOff += ws * dt; mountOff += ws * 0.08 * dt; rayOff += ws * 0.3 * dt;
  for (const c of clouds) { c.x -= ws * 0.05 * dt + 4 * dt; if (c.x < -150) { c.x = W + 150; c.y = rand(20, 75); } }
  shake = Math.max(0, shake - dt);

  if (state === 'title') {
    orca.y = 300 + Math.sin(t * 1.5) * 25; orca.vy = Math.cos(t * 1.5) * 40;
  }

  if (state === 'dying' || state === 'over') {
    dieT += dt;
    if (dieKind === 'flip') {
      // roll belly-up and float slowly to the surface
      orca.flip = Math.min(1, orca.flip + dt * 1.5);
      orca.y += (SURFACE + 26 - orca.y) * Math.min(1, dt * 0.8);
      orca.vy *= 0.9;
    }
    if (state === 'dying' && dieT > 2.2) gameOver();
  }

  const live = state === 'play';
  if (live || state === 'dying') {
   if (live) {
    elapsed += dt;
    speed = Math.min(260, 105 + elapsed * 0.7); // slowly faster the whole game
    invuln = Math.max(0, invuln - dt);
    orca.chomp = Math.max(0, orca.chomp - dt);

    // Orca: sinks slowly, a tap gives a soft push up. Surface and seabed are soft walls.
    orca.vy = Math.min(orca.vy + 360 * dt, 160);
    orca.y += orca.vy * dt;
    const top = SURFACE + 22, bottom = SEABED - 22;
    if (orca.y < top) { if (orca.vy < -150) splash(ORCA_X + 30); orca.y = top; if (orca.vy < 0) orca.vy *= -0.2; }
    if (orca.y > bottom) { orca.y = bottom; orca.vy = 0; }
    orca.snap = Math.max(0, orca.snap - dt);
    const ahead = (x, y) => x > ORCA_X + 30 && x < ORCA_X + 170 && Math.abs(y - orca.y) < 55;
    const food = fishes.some(f => ahead(f.x, f.y)) || seals.some(s => s.inWater && ahead(s.x, s.y)) || (sunfish && ahead(sunfish.x - 30, sunfish.y));
    const want = orca.snap > 0 ? 0 : food ? 1 : 0;
    orca.mouth += (want - orca.mouth) * Math.min(1, dt * (orca.snap > 0 ? 30 : 10));
    orca.bubble -= dt;
    if (orca.bubble < 0) { orca.bubble = rand(0.3, 0.7); bubble(ORCA_X + 50, orca.y - 6, rand(1.5, 3)); }

    // Spawners
    if ((fishTimer -= dt) <= 0) { spawnFish(); fishTimer = rand(0.7, 1.3); }
    if ((floeTimer -= dt) <= 0) spawnFloe();
    if ((obsTimer -= dt) <= 0) spawnObstacle();
    if (!sunfish && !warn && (sunTimer -= dt) <= 0) warn = { y: rand(SURFACE + 90, SEABED - 90), t: 1.6 };
    if (warn && (warn.t -= dt) <= 0) { sunfish = { x: W + 60, by: warn.y, y: warn.y, ph: rand(0, 6) }; warn = null; sunTimer = rand(35, 55); }
   }

    // Fish
    for (const f of fishes) {
      f.x -= (ws + f.vx) * dt;
      f.y = f.by + Math.sin(t * 2 + f.ph) * 10;
      if (live && !f.dead && mouthHits(f.x, f.y, 8 * f.s)) {
        f.dead = true; orca.chomp = 0.15; orca.snap = 0.15; sfx.eat();
        addScore(1, f.x, f.y - 20);
        for (let i = 0; i < 4; i++) bubble(f.x, f.y, rand(1.5, 3));
      }
    }
    fishes = fishes.filter(f => !f.dead && f.x > -40);

    // Ice floes: swim right under one and the seal falls in
    for (const f of floes) {
      f.x -= ws * dt;
      if (f.tipped) f.tipT += dt;
      if (live && f.hasSeal && !f.tipped && ORCA_X + 45 > f.x && ORCA_X - 35 < f.x + f.w && orca.y < SURFACE + 85) {
        f.tipped = true;
        const cx = f.x + f.w / 2;
        seals.push({ x: cx, y: waveY(cx) - 24, vx: -30, vy: -130, inWater: false, ang: 0 });
      }
    }
    floes = floes.filter(f => f.x + f.w > -60);

    // Seals: fall, splash, then wiggle straight to the orca's mouth
    for (const s of seals) {
      if (!s.inWater) {
        s.vy += 700 * dt;
        s.x += (s.vx - ws) * dt; s.y += s.vy * dt;
        s.ang = clamp(s.vy / 400, -0.5, 1.2);
        if (s.y > SURFACE + 8) { s.inWater = true; s.vy = 60; s.dive = rand(SURFACE + 110, SEABED - 60); splash(s.x); sfx.splash(); }
      } else {
        // Swims away from the orca and dives, so you have to chase it
        const vy = clamp((s.dive - s.y) * 1.5, -40, 70);
        s.x += (55 - ws) * dt; s.y += vy * dt;
        s.ang = Math.atan2(vy, 55) * 0.8 + Math.sin(t * 12) * 0.12;
      }
      if (live && !s.dead && s.inWater && mouthHits(s.x, s.y, 14)) {
        s.dead = true; orca.chomp = 0.2; orca.snap = 0.2; sfx.seal();
        addScore(5, s.x, s.y - 25, '+5', 32);
        for (let i = 0; i < 8; i++) bubble(s.x, s.y, rand(2, 4));
      }
    }
    seals = seals.filter(s => !s.dead && s.x > -60);

    // Sunfish: ram it and it explodes
    if (sunfish) {
      sunfish.x -= ws * 0.75 * dt;
      sunfish.y = sunfish.by + Math.sin(t * 0.8 + sunfish.ph) * 15;
      if (live && hitsCircle(sunfish.x, sunfish.y, 36, 18)) {
        explode(sunfish.x, sunfish.y); sfx.pop(); shake = 0.5; orca.chomp = 0.2; orca.snap = 0.2;
        addScore(10, sunfish.x, sunfish.y - 50, 'POP! +10', 40);
        sunfish = null;
      } else if (sunfish.x < -100) sunfish = null;
    }

    // Obstacles
    for (const o of obstacles) {
      let hit = false;
      if (o.type === 'boat') {
        o.x -= ws * dt;
        o.sway = Math.sin(t * 1.1 + o.seed) * 14;
        if (o.torn) o.tearT += dt;
        else o.depth = o.net + Math.sin(t * 0.8 + o.seed) * 32;
        const nx = o.x + 150 + o.sway, ny = SURFACE + 30;
        hit = !o.torn && !o.caught && hitsRect(nx + 6, ny, 78, o.depth - 36, 14);
      } else if (o.type === 'sub') {
        o.x -= (ws + 15) * dt;
        o.y = o.by + Math.sin(t * 0.9 + o.ph) * 38;
        o.tilt = Math.cos(t * 0.9 + o.ph) * -0.07;
        hit = hitsRect(o.x + 6, o.y - 20, 160, 40, 14) || hitsRect(o.x + 72, o.y - 42, 36, 20, 12);
      } else if (o.type === 'whaler') {
        // the harpooner aims at the orca, then fires (up to two shots)
        o.x -= ws * dt;
        o.recoil = Math.max(0, o.recoil - dt);
        const gx = o.x + 18, gy = waveY(o.x + 85) - 40;
        o.aim = Math.atan2(orca.y - gy, ORCA_X - gx);
        if (live && o.shots < 2 && gx > ORCA_X + 140 && gx < W - 30) {
          o.cool -= dt;
          if (o.cool <= 0) {
            const c = Math.cos(o.aim), sn = Math.sin(o.aim);
            harpoons.push({ x: gx + c * 24, y: gy + sn * 24, vx: c * 330, vy: sn * 330, from: o, wet: false, life: 3 });
            o.shots++; o.cool = 2.4; o.recoil = 0.3; sfx.harpoon();
          }
        }
      } else {
        o.x -= ws * dt;
        o.y = o.by + Math.sin(t * 1.5 + o.ph) * 25;
        hit = hitsCircle(o.x, o.y + 6, 18, 14);
      }
      if (live && hit && invuln <= 0) {
        lives--; invuln = 2; shake = 0.3; sfx.hit();
        if (lives <= 0) { die(o.type === 'boat' ? 'net' : 'flip', o); break; }
        if (o.type === 'boat') {
          // the net stretches around the orca and rips
          o.torn = true; o.tearT = 0;
          o.hitY = clamp(orca.y - (SURFACE + 30), 18, o.depth - 30 - 25);
          sfx.tear(); addText(ORCA_X, orca.y - 50, 'Rip!', '#ff9a9a', 30);
        } else addText(ORCA_X, orca.y - 50, 'Ouch!', '#ff9a9a', 30);
      }
    }
    obstacles = obstacles.filter(o => rightEdge(o) > -20);

    // Harpoons: fly on a rope, slow down in the water, hurt on a hit
    for (const h of harpoons) {
      h.x += (h.vx - ws) * dt; h.y += h.vy * dt; h.life -= dt;
      if (!h.wet) h.vy += 80 * dt;
      if (!h.wet && h.y > waveY(h.x)) { h.wet = true; h.vx *= 0.7; h.vy *= 0.7; splash(h.x); sfx.splash(); }

// Snowy ridge with faceted shading: the sun is on the right, so each peak's left slope is in shade
function ridge(fn, step, fill, shade) {
  const ys = [];
  ctx.beginPath(); ctx.moveTo(0, SURFACE + 5);
  for (let x = 0; x <= W + step; x += step) { const y = fn(x); ys.push(y); ctx.lineTo(x, y); }
  ctx.lineTo(W + step, SURFACE + 5); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.fillStyle = shade; ctx.beginPath();
  for (let i = 1, v = 0; i < ys.length; i++) {
    if (ys[i] < ys[i - 1]) continue;       // still climbing towards a peak
    if (i - 1 > v) {                       // ys[v] is the valley, ys[i-1] the peak: shade the slope between
      ctx.moveTo(v * step, ys[v]);
      for (let k = v + 1; k < i; k++) ctx.lineTo(k * step, ys[k]);
      ctx.lineTo((i - 1) * step + (SURFACE + 5 - ys[i - 1]) * 0.8, SURFACE + 5); ctx.lineTo(v * step, SURFACE + 5); ctx.closePath();
    }

  }
  // bow lamp
  ctx.fillStyle = '#fff5c0'; ctx.beginPath(); ctx.arc(6, -6, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawJelly(j) {
  ctx.save(); ctx.translate(j.x, j.y);
  ctx.lineCap = 'round';
  // fine tentacles and a few thicker oral arms
  ctx.strokeStyle = 'rgba(255,190,225,0.55)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 7; i++) {
    const x0 = -15 + i * 5;
    ctx.beginPath(); ctx.moveTo(x0, 2);
    for (let k = 1; k <= 6; k++) ctx.lineTo(x0 + Math.sin(t * 4 + k + i) * 3, 2 + k * 7);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,140,200,0.7)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const x0 = -6 + i * 6;
    ctx.beginPath(); ctx.moveTo(x0, 2);
    for (let k = 1; k <= 4; k++) ctx.lineTo(x0 + Math.sin(t * 3 + k * 1.3 + i) * 4, 2 + k * 6);
    ctx.stroke();
  }
  const pulse = 1 + Math.sin(t * 4 + j.ph) * 0.06;
  ctx.scale(pulse, 1 / pulse);
  // translucent bell with organs showing through
  ctx.fillStyle = G.jelly;
  ctx.beginPath(); ctx.arc(0, 0, 20, Math.PI, 0);
  for (let i = 0; i < 4; i++) ctx.quadraticCurveTo(20 - i * 10 - 5, 7, 20 - (i + 1) * 10, 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,225,242,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(250,95,165,0.55)'; ctx.beginPath();
  for (const [a, b] of [[-7, -6], [0, -9], [7, -6], [0, -3]]) { ctx.moveTo(a + 4, b); ctx.ellipse(a, b, 4, 3, 0, 0, Math.PI * 2); }
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-8, -11, 5, 2.5, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- Drawing: effects and HUD ----------
function drawParticles(kinds) {
  for (const p of particles) {
    if (!kinds.includes(p.k)) continue;
    const a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'bubble') {
      ctx.strokeStyle = `rgba(255,255,255,${0.7 * a})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    } else if (p.k === 'drop') {
      ctx.fillStyle = `rgba(230,248,255,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (p.k === 'ring') {
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 6 * a + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    } else if (p.k === 'bit') {
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.7); ctx.restore();
    } else if (p.k === 'star') {
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = '#ffe14d'; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const r = i % 2 ? p.r * 0.45 : p.r, an = i * Math.PI / 5; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
}
function textOut(s, x, y, size, color, align) {
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = 'rgba(6,36,61,0.85)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function heart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -14, 0, -7); ctx.bezierCurveTo(8, -14, 14, -4, 0, 6); ctx.closePath();
  ctx.fillStyle = full ? '#ff5c7a' : 'rgba(255,255,255,0.25)'; ctx.fill();
  ctx.strokeStyle = 'rgba(6,36,61,0.8)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
}
function drawMute() {
  const x = W - 40, y = 30;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(6,36,61,0.5)'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-9, -4); ctx.lineTo(-4, -4); ctx.lineTo(2, -9); ctx.lineTo(2, 9); ctx.lineTo(-4, 4); ctx.lineTo(-9, 4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
  if (muted) { ctx.moveTo(6, -5); ctx.lineTo(12, 5); ctx.moveTo(12, -5); ctx.lineTo(6, 5); }
  else { ctx.arc(3, 0, 6, -0.9, 0.9); ctx.moveTo(3 + 10 * Math.cos(-0.9), 10 * Math.sin(-0.9)); ctx.arc(3, 0, 10, -0.9, 0.9); }
  ctx.stroke(); ctx.restore();
}
function panel(w, h) {
  const x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = 'rgba(6,36,61,0.72)'; rr(x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.stroke();
  return { x, y };
}
function drawTitle() {
  const p = panel(560, 400);
  textOut('Hungry Orca', W / 2, p.y + 52, 54, '#ffffff');
  textOut('Tap, click or press Space to swim up', W / 2, p.y + 100, 20, '#cdeaf7');
  const L = W / 2 - 200;
  const rows = [
    [() => drawFish({ x: 0, y: 0, s: 1.3, c: '#3a6a8c', ph: 0 }), '+1', 'Eat fish'],
    [() => drawSeal(0, 0, 0), '+5', 'Swim right under the ice'],
    [() => { ctx.scale(0.42, 0.42); drawSunfish({ x: 0, y: 0 }); }, '+10', 'Rare sunfish: ram it!'],
    [() => { ctx.scale(0.25, 0.25); drawSub({ x: -88, y: 0 }); }, '', 'Avoid nets, harpoons, subs, jellyfish'],
  ];
  rows.forEach(([icon, pts, label], i) => {
    const y = p.y + 150 + i * 46;
    ctx.save(); ctx.translate(L + 20, y); icon(); ctx.restore();
    if (pts) textOut(pts, L + 80, y, 24, '#fff7c2');
    textOut(label, L + 115, y, 21, '#ffffff', 'left');
  });
  if (Math.sin(t * 4) > -0.4) textOut('Tap to start', W / 2, p.y + 362, 30, '#ffe14d');
  if (best) textOut('Best: ' + best, W / 2, p.y + 330, 18, '#cdeaf7');
}
function drawOver() {
  const p = panel(420, 260);
  textOut('Game over', W / 2, p.y + 50, 48, '#ffffff');
  textOut('Score: ' + score, W / 2, p.y + 110, 32, '#fff7c2');
  textOut(newBest ? 'New best!' : 'Best: ' + best, W / 2, p.y + 152, 24, newBest ? '#ffe14d' : '#cdeaf7');
  if (t - overAt > 0.8 && Math.sin(t * 4) > -0.4) textOut('Tap to play again', W / 2, p.y + 215, 28, '#ffe14d');
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#06243d'; ctx.fillRect(0, 0, cv.width, cv.height);
  // Phone held upright: fill the space above and below the game with sky and sand
  if (offY > 1) {
    ctx.fillStyle = '#7fb0d8'; ctx.fillRect(0, 0, cv.width, offY * dpr + 2);
    ctx.fillStyle = '#121923'; ctx.fillRect(0, cv.height - offY * dpr - 2, cv.width, offY * dpr + 2);
    ctx.font = `700 ${Math.round(18 * dpr)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#06243d'; ctx.fillText('Turn your phone sideways for a bigger view', cv.width / 2, offY * dpr / 2);
  }
  const sx = shake > 0 ? rand(-1, 1) * shake * 14 : 0, sy = shake > 0 ? rand(-1, 1) * shake * 14 : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx * scale), dpr * (offY + sy * scale));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  drawSky();
  drawWaterBase();
  for (const f of floes) drawFloe(f);
  for (const o of obstacles) { if (o.type === 'boat') drawBoatHull(o); else if (o.type === 'whaler') drawWhaler(o); }
  drawWaterTint();
  drawRays();
  drawSeabed();
  for (const o of obstacles) { if (o.type === 'boat') drawNet(o); else if (o.type === 'sub') drawSub(o); else if (o.type === 'jelly') drawJelly(o); }
  drawHarpoons();
  for (const f of fishes) drawFish(f);
  for (const s of seals) drawSeal(s.x, s.y, s.ang, s.inWater);
  if (sunfish) drawSunfish(sunfish);
  drawParticles(['bubble', 'bit', 'star', 'ring']);
  const blink = invuln > 0 && Math.floor(t * 10) % 2 === 0;
  let ox = ORCA_X, oang = orcaAngle();
  if (dieKind === 'net' && netBoat) { ox = netBoat.x + orca.netOff; oang = state === 'over' ? 0 : Math.sin(t * 14) * 0.12; }
  else if (dieKind === 'flip') oang *= 1 - orca.flip;
  drawOrca(ox, orca.y, oang, blink ? 0.35 : 1, orca.flip || 0, !!dieKind);
  if (dieKind === 'net' && netBoat) drawWrappedNet(netBoat, ox, orca.y);
  drawSurfaceLine();
  drawParticles(['drop']);
  if (warn && Math.floor(t * 6) % 2 === 0) {
    ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(W - 34, warn.y, 18, 0, Math.PI * 2); ctx.fill();
    textOut('!', W - 34, warn.y + 1, 26, '#06243d');
  }
  for (const tx of texts) { ctx.globalAlpha = clamp(tx.life * 2, 0, 1); textOut(tx.s, tx.x, tx.y, tx.size, tx.c); ctx.globalAlpha = 1; }

  // HUD
  if (state === 'play' || state === 'dying') {
    textOut(String(score), 24, 32, 36, '#ffffff', 'left');
    for (let i = 0; i < 3; i++) heart(34 + i * 30, 70, 1.2, i < lives);
  }
  drawMute();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  ctx.restore();
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
