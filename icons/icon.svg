<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
<!-- Same style as PrimeTime, ProPoker and ProQuiz: a glossy gradient, a glass disc with a rim light, a white symbol -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0ef"/><stop offset=".55" stop-color="#1a7fc0"/><stop offset="1" stop-color="#0b3f73"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04213f" flood-opacity=".45"/></filter>
<!-- The orca: same shape as the game's drawOrca(), white, with the eye patch cut out and the belly/flank patch see-through -->
<clipPath id="bodyclip"><path d="M68 2 C68 -5 62 -10 52 -12 C34 -15.5 12 -16 -8 -15.5 C-32 -14 -56 -8 -82 -3 L-82 3 C-60 6 -38 14 -14 14.5 C6 15 22 12.5 32 9 L28 3 Z"/></clipPath>
<mask id="marks" maskUnits="userSpaceOnUse" x="-130" y="-80" width="220" height="120">
  <g fill="#fff">
    <path d="M68 2 C68 -5 62 -10 52 -12 C34 -15.5 12 -16 -8 -15.5 C-32 -14 -56 -8 -82 -3 L-82 3 C-60 6 -38 14 -14 14.5 C6 15 22 12.5 32 9 L28 3 Z"/>
    <path d="M28 1 L65 1.2 Q68 6.5 59 9 C47 11.5 36 11 29 9 Z"/>
    <path d="M6 -14 Q-1 -36 -10 -58 Q-8 -34 -12 -14 Z"/>
    <path d="M-72 -4 Q-92 -5 -111 -2.5 Q-113 0 -110 1.5 Q-92 5 -72 4 Z"/>
    <path d="M-76 -3 Q-90 -6 -108 -6.5 Q-100 -3 -92 -1 Z" fill="#bbb"/>
    <path transform="translate(18 10) rotate(45.8)" d="M-2 -3 Q10 -8 18 -2 Q22 4 15 6.5 Q6 8 -2 3 Z"/>
  </g>
  <path clip-path="url(#bodyclip)" fill="#a8a8a8" d="M38 4 C20 8 4 10 -12 10 C-22 10 -27 7 -31 3 C-36 -3 -44 -7 -56 -7 C-52 -3 -54 2 -64 5.5 L-64 40 L72 40 Z"/>
  <ellipse cx="33" cy="-7.5" rx="11" ry="3.2" transform="rotate(8 33 -7.5)" fill="#000"/>
</mask>
</defs>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
<circle cx="256" cy="256" r="150" fill="#fff" fill-opacity=".18" filter="url(#sh)"/>
<circle cx="256" cy="256" r="150" fill="none" stroke="url(#rim)" stroke-width="6"/>
<ellipse cx="256" cy="166" rx="100" ry="45" fill="#fff" opacity=".2"/>
<g transform="translate(262 270) rotate(-9) scale(1.6 1.95) translate(22 21)"><rect x="-130" y="-80" width="220" height="120" fill="#fff" mask="url(#marks)"/></g>
<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)" opacity=".55"/>
<rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#rim)" stroke-width="4" opacity=".7"/>
</svg>
